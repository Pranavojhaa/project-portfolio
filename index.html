    <script>
      // Scroll reveals are opt-in: without this script, IntersectionObserver, or with reduced motion, nothing is hidden.
      (function () {
        window.__reveal = function () {};
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce || !("IntersectionObserver" in window)) return;
        document.documentElement.classList.add("reveal-ready");
        var observerRan = false;
        var observer = new IntersectionObserver(
          function (entries) {
            observerRan = true;
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.setAttribute("data-revealed", "");
                observer.unobserve(entry.target);
              }
            });
          },
          { rootMargin: "0px 0px -6% 0px", threshold: 0.08 }
        );
        window.__reveal = function () {
          document.querySelectorAll("[data-reveal]:not([data-revealed])").forEach(function (el) {
            observer.observe(el);
          });
        };
        function revealAll() {
          document.querySelectorAll("[data-reveal]").forEach(function (el) {
            el.setAttribute("data-revealed", "");
          });
        }
        window.addEventListener("beforeprint", revealAll);
        // Failsafe: if the observer never reports (a renderer that paints no frames), show everything.
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            if (!observerRan) revealAll();
          }, 3000);
        });
      })();
    </script>
